<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partylist Presentations</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "Poppins", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    color: #ffffff;
    background:
        radial-gradient(circle at 12% 18%, rgba(0, 188, 212, 0.28), transparent 30%),
        radial-gradient(circle at 88% 78%, rgba(255, 193, 7, 0.22), transparent 28%),
        linear-gradient(135deg, #071421, #11324d 48%, #1f2933);
}

main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
}

.selector {
    width: min(1100px, 94vw);
    display: grid;
    gap: 28px;
}

.heading {
    text-align: center;
}

.heading h1 {
    font-size: 3.2rem;
    line-height: 1.08;
    margin-bottom: 12px;
}

.heading p {
    color: #d7edf6;
    font-size: 1.25rem;
    line-height: 1.5;
}

.party-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
}

.party-card {
    min-height: 520px;
    color: #ffffff;
    text-decoration: none;
    border-radius: 20px;
    background: rgba(8, 21, 34, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
    backdrop-filter: blur(18px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 36px;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.party-card:hover,
.party-card:focus-visible {
    transform: translateY(-6px);
    background: rgba(12, 31, 49, 0.82);
    outline: none;
}

.party-card.apipa {
    border-top: 7px solid #00bcd4;
}

.party-card.on {
    border-top: 7px solid #ffc107;
}

.party-card.apipa:hover,
.party-card.apipa:focus-visible {
    border-color: rgba(0, 188, 212, 0.72);
}

.party-card.on:hover,
.party-card.on:focus-visible {
    border-color: rgba(255, 193, 7, 0.72);
}

.party-logo {
    width: 60%;
    max-height: 260px;
    object-fit: contain;
    margin-bottom: 28px;
    filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.34));
}

.party-card h2 {
    font-size: 2.45rem;
    line-height: 1.12;
    margin-bottom: 12px;
}

.party-card p {
    color: #eef6fb;
    font-size: 1.25rem;
    line-height: 1.5;
}

@media (max-width: 820px) {
    main {
        align-items: flex-start;
    }

    .heading h1 {
        font-size: 2.4rem;
    }

    .party-grid {
        grid-template-columns: 1fr;
    }

    .party-card {
        min-height: 430px;
    }

    .party-logo {
        max-height: 210px;
    }
}

@media (max-width: 520px) {
    main {
        padding: 18px;
    }

    .selector {
        width: 100%;
        gap: 20px;
    }

    .heading h1 {
        font-size: 2rem;
    }

    .heading p,
    .party-card p {
        font-size: 1rem;
    }

    .party-card {
        min-height: 360px;
        padding: 24px 18px;
    }

    .party-card h2 {
        font-size: 1.8rem;
    }

    .party-logo {
        max-height: 160px;
        margin-bottom: 20px;
    }
}
</style>
</head>
<body>
<main>
    <section class="selector" aria-label="Partylist presentation selector">
        <div class="heading">
            <h1>Partylist Presentations</h1>
            <p>Select a partylist to open its presentation.</p>
        </div>

        <div class="party-grid">
            <a class="party-card apipa" href="apipa.html">
                <img class="party-logo" src="img1.png" alt="APIPA logo">
                <h2>APIPA</h2>
                <p>Action Progress and Innovation Partylist</p>
            </a>

            <a class="party-card on" href="on.html">
                <img class="party-logo" src="img2.png" alt="ON Partylist logo">
                <h2>ON Partylist</h2>
                <p>Oriented Nexus Partylist</p>
            </a>
        </div>
    </section>
</main>
</body>
</html>
